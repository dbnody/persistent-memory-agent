[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-memory-agent"
version = "0.1.0"
description = "Provider-agnostic persistent memory layer for AI agents"
requires-python = ">=3.10"

[project.scripts]
memory-agent = "memory_agent.cli:main"

[tool.setuptools.packages.find]
include = ["memory_agent*"]
